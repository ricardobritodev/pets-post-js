<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pets Post — pets perdidos, encontrados e para adoção</title>
    <meta name="description" content="Divulgue pets perdidos e encontrados, encontre um pet para adotar e parceiros perto de você." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/home.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-stone-50 text-stone-800 antialiased">
    <div id="app-header"></div>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-12">
      <div id="app-flash" class="mb-6 space-y-2" aria-live="polite"></div>
      <section class="max-w-2xl">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Ajude pets a voltarem para casa</h1>
        <p class="mt-4 text-lg text-stone-600">
          Nova versão do Pets Post em Node.js, Express, Prisma e Vite. As funcionalidades
          estão sendo migradas módulo a módulo.
        </p>
      </section>

      <section class="mt-10 rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-stone-500">Status do sistema</h2>
        <dl class="mt-4 grid gap-4 sm:grid-cols-2">
          <div class="flex items-center gap-3">
            <span data-status="api" class="status-dot"></span>
            <dt class="font-medium">API</dt>
            <dd data-status-text="api" class="text-stone-500">verificando…</dd>
          </div>
          <div class="flex items-center gap-3">
            <span data-status="db" class="status-dot"></span>
            <dt class="font-medium">Banco de dados</dt>
            <dd data-status-text="db" class="text-stone-500">verificando…</dd>
          </div>
        </dl>
      </section>
    </main>
    <footer id="app-footer" class="border-t border-stone-200 bg-white"></footer>
  </body>
</html>
