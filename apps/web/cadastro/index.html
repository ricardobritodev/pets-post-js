<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta · Pets Post</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/cadastro.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-stone-50 text-stone-800 antialiased">
    <div id="app-header"></div>
    <main class="mx-auto w-full max-w-md flex-1 px-4 py-10">
      <div id="app-flash" class="mb-4 space-y-2" aria-live="polite"></div>
      <section class="card">
        <div class="mb-6 text-center">
          <div class="text-5xl" aria-hidden="true">🐾</div>
          <h1 class="mt-2 text-2xl font-bold">Criar conta</h1>
          <p class="mt-1 text-stone-600">Cadastre-se para publicar anúncios e ajudar pets perdidos.</p>
        </div>

        <form id="register-form" class="space-y-4" novalidate>
          <div>
            <label for="name" class="label">Nome completo</label>
            <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="100" class="input" />
          </div>
          <div>
            <label for="email" class="label">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="120" class="input" />
          </div>
          <div>
            <label for="phone" class="label">Telefone / WhatsApp <span class="font-normal text-stone-500">(opcional)</span></label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="(11) 98765-4321" class="input" />
          </div>
          <div>
            <label for="password" class="label">Senha</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" class="input" aria-describedby="password-hint" />
            <p id="password-hint" class="mt-1 text-xs text-stone-500">Mínimo de 8 caracteres.</p>
          </div>
          <div>
            <label for="confirmPassword" class="label">Confirmar senha</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required class="input" />
          </div>
          <button type="submit" class="btn btn-primary w-full">Criar conta</button>
        </form>

        <p class="mt-6 border-t border-stone-200 pt-4 text-center text-stone-600">
          Já tem uma conta?
          <a id="login-link" href="/login/" class="font-semibold text-brand-700 hover:underline">Entrar</a>
        </p>
      </section>
    </main>
    <footer id="app-footer" class="border-t border-stone-200 bg-white"></footer>
  </body>
</html>
