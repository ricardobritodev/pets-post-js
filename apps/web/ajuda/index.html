<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajuda · Pets Post</title>
    <meta name="description" content="Perguntas frequentes do Pets Post: pets perdidos e encontrados, adoção, anúncios, conta, mapa e loja dos parceiros." />
    <link rel="icon" href="/brand/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script type="module" src="/src/pages/help.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-stone-50 text-stone-800 antialiased">
    <div id="app-header"></div>
    <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-10">
      <div id="app-flash" class="mb-6 space-y-2" aria-live="polite"></div>
      <header class="mb-8 text-center">
        <div class="text-brand-600"><i data-icon="question-mark-circle" data-size="48" class="mx-auto"></i></div>
        <h1 class="mt-2 text-3xl font-bold">Como podemos ajudar?</h1>
        <p class="mt-2 text-stone-600">Perguntas frequentes sobre o Pets Post. Não achou? Use o botão "Ajuda" ou fale com a gente.</p>
      </header>
      <form id="faq-search" class="mb-8" role="search">
        <label for="faq-q" class="sr-only">Buscar nas perguntas</label>
        <input id="faq-q" type="search" maxlength="200" class="header-search-input" placeholder="Busque: perdi meu cachorro, senha, adoção…" />
      </form>
      <div id="faq-list" class="space-y-8" aria-live="polite"></div>
    </main>
    <footer id="app-footer" class="border-t border-stone-200 bg-white"></footer>
  </body>
</html>
