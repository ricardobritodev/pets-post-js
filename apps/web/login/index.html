<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar · Pets Post</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/login.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-stone-50 text-stone-800 antialiased">
    <div id="app-header"></div>
    <main class="mx-auto w-full max-w-md flex-1 px-4 py-10">
      <div id="app-flash" class="mb-4 space-y-2" aria-live="polite"></div>
      <section class="card">
        <div class="mb-6 text-center">
          <div class="text-5xl" aria-hidden="true">🐾</div>
          <h1 class="mt-2 text-2xl font-bold">Bem-vindo de volta!</h1>
          <p class="mt-1 text-stone-600">Entre na sua conta para gerenciar seus anúncios.</p>
        </div>

        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label for="email" class="label">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required class="input" />
          </div>
          <div>
            <label for="password" class="label">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required class="input" />
          </div>
          <label class="flex items-center gap-2 text-sm">
            <input id="remember" name="remember" type="checkbox" class="size-4 accent-brand-600" />
            Lembrar de mim
          </label>
          <button type="submit" class="btn btn-primary w-full">Entrar</button>
        </form>

        <p class="mt-6 border-t border-stone-200 pt-4 text-center text-stone-600">
          Não tem uma conta?
          <a id="register-link" href="/cadastro/" class="font-semibold text-brand-700 hover:underline">Cadastre-se grátis</a>
        </p>
      </section>
    </main>
    <footer id="app-footer" class="border-t border-stone-200 bg-white"></footer>
  </body>
</html>
