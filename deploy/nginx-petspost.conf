# Nginx — proxy reverso + HTTPS (T7.11). Instalado pelo setup-server.sh.
# O endereço oficial é https://www.petspost.com.br (o mesmo do sistema antigo, que já circula
# no WhatsApp). petspost.com.br sem www redireciona para ele.
#
# Os blocos "listen 443" e os caminhos dos certificados são adicionados pelo certbot
# (certbot --nginx), que também cria o redirect de http para https.

upstream petspost_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name petspost.com.br;
    return 301 https://www.petspost.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.petspost.com.br;

    # A API aceita até 8 MB por envio de foto (BR-PHOTO-003) e responde 413 em JSON acima disso.
    # Aqui fica um pouco acima para quem responder ser a API, com a mensagem certa.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://petspost_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A API confia em 1 proxy (trust proxy = 1): o rate limit vê o IP real.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
